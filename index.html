<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Abroad Application Tracker</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --surface-3:#eae9e4;
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781;
  --line:#e1e0d9; --border:rgba(11,11,11,0.10); --shadow:0 1px 2px rgba(11,11,11,.06),0 8px 24px rgba(11,11,11,.08);
  --accent:#2a78d6; --accent-soft:#cde2fb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --violet:#4a3aa7; --aqua:#1baf7a; --green:#008300; --orange:#eb6834; --magenta:#e87ba4;
  --radius:10px; --radius-sm:6px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2c2c2a;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --border:rgba(255,255,255,0.10); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --accent:#3987e5; --accent-soft:#184f95;
  --violet:#9085e9; --aqua:#199e70; --green:#008300; --orange:#d95926; --magenta:#d55181;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:224px 1fr;height:100vh}
#sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:9px}
.brand .mark{
  width:26px;height:26px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;
}
.brand h1{font-size:14px;line-height:1.15}
.brand .sub{font-size:11px;color:var(--muted);margin-top:3px}
nav{padding:8px;overflow-y:auto;flex:1;min-height:0}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 10px 5px;font-weight:650}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:0;background:none;
  border-radius:var(--radius-sm);cursor:pointer;color:var(--text-2);text-align:left;font-size:13px;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text);font-weight:600}
:root[data-theme="dark"] .nav-item.active{color:#fff}
.nav-item .ico{width:16px;text-align:center;flex:none;opacity:.85}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.stale{background:var(--warn)}
.dot.err{background:var(--crit)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
header.top{
  display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:var(--surface);flex:none;
}
header.top h2{font-size:17px}
header.top .desc{font-size:12px;color:var(--muted);margin-top:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
#view{overflow-y:auto;padding:22px;flex:1;min-height:0}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;
  font-size:13px;font-weight:500;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--border)}
.btn.danger:hover{background:color-mix(in srgb,var(--crit) 12%,var(--surface))}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.icon-btn{width:30px;height:30px;padding:0;justify-content:center}

input[type=text],input[type=date],input[type=number],input[type=url],input[type=email],select,textarea{
  width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{min-height:78px;resize:vertical;line-height:1.5}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.hint{font-size:11px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:120px}
.search{position:relative;min-width:180px;flex:1;max-width:320px}
.search input{padding-left:29px}
.search::before{content:"⌕";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
select.filter{width:auto;min-width:110px}

/* ---------- cards / tables ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:13px}
.card-h .sub{font-size:11px;color:var(--muted)}
.card-b{padding:15px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);
  position:sticky;top:0;z-index:1;
}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tr.clickable{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.actions{text-align:right;white-space:nowrap;width:1%}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:26px;margin-bottom:8px;opacity:.5}
.empty p{margin:0 0 14px;font-size:13px}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);font-size:11.5px;font-weight:550;color:var(--text-2);white-space:nowrap;
}
.badge .bd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;color:var(--text-2)}
.s-researching .bd{background:var(--muted)}
.s-shortlisted .bd{background:var(--violet)}
.s-preparing   .bd{background:var(--warn)}
.s-submitted   .bd{background:var(--accent)}
.s-interview   .bd{background:var(--aqua)}
.s-offer       .bd{background:var(--good)}
.s-waitlisted  .bd{background:var(--serious)}
.s-rejected    .bd{background:var(--crit)}
.s-enrolled    .bd{background:var(--green)}
.s-withdrawn   .bd{background:var(--muted);opacity:.6}
.s-awarded .bd{background:var(--good)}
.s-applied .bd{background:var(--accent)}
.s-asked .bd{background:var(--warn)}
.s-reminded .bd{background:var(--serious)}
.s-declined .bd{background:var(--crit)}
.s-notasked .bd{background:var(--muted)}
.s-final .bd{background:var(--good)}
.s-draft .bd{background:var(--warn)}
.s-needed .bd{background:var(--crit)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px}
.tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650}
.tile .val{font-size:26px;font-weight:660;margin-top:6px;letter-spacing:-.02em;line-height:1.1}
.tile .sub{font-size:11.5px;color:var(--text-2);margin-top:4px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grid2.tight{grid-template-columns:1.3fr 1fr;align-items:start}
@media(max-width:1100px){.grid2.tight{grid-template-columns:1fr}}

/* ---------- bar chart ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:130px 1fr minmax(52px,auto);align-items:center;gap:10px;font-size:12.5px}
.bar-row .bl{color:var(--text-2);display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);min-width:2px;transition:width .25s ease}
.bar-row .bv{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- deadline radar ---------- */
.dl-list{display:flex;flex-direction:column}
.dl{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl .chip{
  min-width:52px;text-align:center;padding:4px 6px;border-radius:var(--radius-sm);font-size:11px;font-weight:650;
  background:var(--surface-2);color:var(--text-2);font-variant-numeric:tabular-nums;flex:none;border:1px solid var(--border);
}
.dl.overdue .chip{background:color-mix(in srgb,var(--crit) 15%,var(--surface));color:var(--crit);border-color:transparent}
.dl.soon .chip{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--text);border-color:transparent}
.dl .txt{min-width:0;flex:1}
.dl .t1{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .t2{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .when{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:8px;min-width:104px}
.prog .track{flex:1;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:block}
.prog .fill{display:block;height:6px;background:var(--accent);border-radius:3px}
.prog .fill.done{background:var(--good)}
.prog .pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;width:31px;text-align:right}

/* ---------- kanban ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:var(--surface-2);border-radius:var(--radius);width:252px;flex:none;border:1px solid var(--line)}
.col-h{padding:10px 12px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;border-bottom:1px solid var(--line)}
.col-h .n{margin-left:auto;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:56px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.kcard:hover{border-color:var(--accent)}
.kcard.dragging{opacity:.4}
.kcard .u{font-size:13px;font-weight:600;line-height:1.3}
.kcard .p{font-size:11.5px;color:var(--text-2);margin-top:2px}
.kcard .m{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}
.col.drop-target{outline:2px dashed var(--accent);outline-offset:-2px}

/* ---------- modal / drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,11,11,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:660px;border:1px solid var(--line)}
.modal.wide{max-width:900px}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:15px}
.modal-b{padding:20px}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 12px 12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}}

.drawer-scrim{position:fixed;inset:0;background:rgba(11,11,11,.42);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);background:var(--page);z-index:46;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.drawer-b{overflow-y:auto;padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tab{padding:9px 12px;border:0;background:none;cursor:pointer;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;color:var(--text)}

/* ---------- checklist ---------- */
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:16px;height:16px;margin-top:1px;flex:none;accent-color:var(--accent);cursor:pointer}
.chk .l{flex:1;min-width:0}
.chk .l .t{font-size:13px}
.chk.done .l .t{text-decoration:line-through;color:var(--muted)}
.chk .l .n{font-size:11.5px;color:var(--muted);margin-top:2px}
.chk .due{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chk .due.over{color:var(--crit);font-weight:600}

.row-add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.row-add input[type=text]{flex:1}
.row-add input[type=date]{width:145px}

ul.plain{margin:0;padding-left:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.alt2{color:var(--muted);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
div.alt2{margin-top:1px}
.small{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.sep{height:1px;background:var(--line);margin:2px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.link-out{font-size:12px;text-decoration:none}
.link-out:hover{text-decoration:underline}

#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--page);padding:9px 16px;border-radius:999px;font-size:13px;
  z-index:100;transition:transform .22s ease;box-shadow:var(--shadow);pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:224px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:none}
  #menu-btn{display:inline-flex !important}
  #view{padding:16px}
  header.top{padding:12px 16px}
}
#menu-btn{display:none}
@media print{#sidebar,header.top .top-actions,.toolbar{display:none}#app{grid-template-columns:1fr}#view{overflow:visible}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mark">SA</div>
        <div>
          <h1>Application Tracker</h1>
          <div class="sub" id="brand-sub">Study abroad</div>
        </div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="dot" id="save-dot"></span>
      <span id="save-text">Saved</span>
    </div>
  </aside>

  <div id="main">
    <header class="top">
      <button class="btn icon-btn" id="menu-btn" title="Menu">☰</button>
      <div>
        <h2 id="page-title">Dashboard</h2>
        <div class="desc" id="page-desc"></div>
      </div>
      <div class="top-actions">
        <button class="btn icon-btn" id="theme-btn" title="Toggle light / dark">◐</button>
        <button class="btn" id="page-action" style="display:none"></button>
      </div>
    </header>
    <div id="view"></div>
  </div>
</div>
<div id="toast"></div>
<div id="overlays"></div>
<script>
/* =========================================================================
   Study Abroad Application Tracker — single file, no server, no accounts.
   Data lives in this browser (localStorage) and, optionally, in a .json file
   on your disk that the app writes to directly (Chrome/Edge).
   ========================================================================= */

/* ------------------------------- constants ------------------------------ */
const STATUSES = ['Researching','Shortlisted','Preparing','Submitted','Interview','Offer','Waitlisted','Rejected','Enrolled','Withdrawn'];
const OPEN_STATUSES = ['Researching','Shortlisted','Preparing','Submitted','Interview'];
const DEGREES = ['Bachelor’s','Master’s','MBA','PhD','Diploma','Exchange','Foundation','Other'];
const TIERS = ['Reach','Target','Safety'];
const DOC_TYPES = ['Transcript','Statement of Purpose','Personal Statement','CV / Resume','Recommendation Letter','Passport','Test Score Report','Bank / Financial','Degree Certificate','Portfolio','Research Proposal','Experience Letter','Other'];
const DOC_STATUS = ['Needed','Draft','Final'];
const REQ_STATUS = ['Not asked','Asked','Reminded','Submitted','Declined'];
const SCH_STATUS = ['Researching','Applied','Awarded','Rejected'];
const EXPENSE_CATS = ['Application fee','Test fee','Document / attestation','Translation','Courier','Credential evaluation','Visa fee','Tuition deposit','Health insurance','Travel','Other'];
const TEST_NAMES = ['IELTS','TOEFL iBT','Duolingo English Test','PTE Academic','GRE General','GMAT','SAT','ACT','GRE Subject','Other'];
const VISA_STATUS = ['Not started','Documents','Fee paid','Appointment booked','Biometrics done','Interview done','Approved','Refused'];
const CURRENCIES = ['USD','EUR','GBP','CAD','AUD','JPY','SGD','CHF','SEK','NZD','BDT','INR','PKR','NGN','CNY','KRW','MYR','AED','TRY'];
const DEFAULT_RATES = {USD:1,EUR:1.09,GBP:1.27,CAD:0.73,AUD:0.66,JPY:0.0064,SGD:0.74,CHF:1.12,SEK:0.095,NZD:0.60,BDT:0.0082,INR:0.0116,PKR:0.0036,NGN:0.00065,CNY:0.138,KRW:0.00072,MYR:0.225,AED:0.272,TRY:0.029};

const REQ_TEMPLATE = [
  'Academic transcripts (all institutions)','Degree certificate','Statement of Purpose',
  'CV / Resume','Recommendation letter 1','Recommendation letter 2',
  'English test score sent to university','Passport copy','Proof of funds / bank statement',
  'Application fee paid','Online application form submitted'
];
const VISA_STEPS = ['Acceptance letter received','Tuition deposit paid','I-20 / CAS / CoE issued','Financial proof ready','Visa fee paid','Application form submitted','Appointment booked','Biometrics completed','Interview completed','Medical exam (if required)','Passport returned with visa'];

/* -------------------------------- helpers ------------------------------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
const todayISO = () => new Date().toISOString().slice(0, 10);

function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00'), t = new Date(todayISO() + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
}
function relDays(n){
  if(n === null) return '';
  if(n === 0) return 'today';
  if(n === 1) return 'tomorrow';
  if(n < 0) return Math.abs(n) + 'd late';
  return n + 'd';
}
function toBase(amount, cur){
  const r = state.settings.rates || DEFAULT_RATES;
  const base = state.settings.baseCurrency || 'USD';
  const a = Number(amount) || 0;
  const from = r[cur] ?? DEFAULT_RATES[cur] ?? 1;
  const to = r[base] ?? DEFAULT_RATES[base] ?? 1;
  return a * from / to;
}
/* South Asian currencies read better with lakh/crore grouping and a real symbol */
const CUR_LOCALE = {BDT:'en-IN', INR:'en-IN', PKR:'en-IN', NPR:'en-IN', LKR:'en-IN'};
const CUR_SYMBOL = {BDT:'৳'};
function money(n, cur){
  const c = cur || state.settings.baseCurrency || 'USD';
  try{
    let s = new Intl.NumberFormat(CUR_LOCALE[c] || undefined, {style:'currency', currency:c, maximumFractionDigits:0}).format(Number(n) || 0);
    if(CUR_SYMBOL[c]) s = s.replace(c, CUR_SYMBOL[c]).replace(/\s/, '');
    return s;
  }catch(e){ return c + ' ' + Math.round(Number(n) || 0).toLocaleString(); }
}
/* convert between any two currencies using the USD-per-unit rate table */
function convert(amount, from, to){
  const r = state.settings.rates || DEFAULT_RATES;
  const f = r[from] ?? DEFAULT_RATES[from] ?? 1;
  const t = r[to] ?? DEFAULT_RATES[to] ?? 1;
  return (Number(amount) || 0) * f / t;
}
const homeCur = () => state.settings.homeCurrency || 'BDT';
/** just the "≈ ৳x" part, or '' when there is nothing to convert */
function altText(n, cur){
  const c = cur || state.settings.baseCurrency || 'USD', h = homeCur();
  if(state.settings.dualCurrency === false || h === c) return '';
  return '≈ ' + money(convert(n, c, h), h);
}
/**
 * Money with the home-currency equivalent beside it.
 * money2(96000,'AUD')  ->  "A$96,000  ≈ ৳7,672,000"
 * layout: 'inline' (default) or 'block' (second line — use inside table cells)
 */
function money2(n, cur, layout){
  if(n === '' || n === null || n === undefined || isNaN(Number(n))) return '<span class="muted">—</span>';
  const c = cur || state.settings.baseCurrency || 'USD';
  const main = `<span class="nowrap">${money(n, c)}</span>`;
  const h = homeCur();
  if(state.settings.dualCurrency === false || h === c) return main;
  const alt = `<span class="alt2">≈ ${money(convert(n, c, h), h)}</span>`;
  return layout === 'block' ? `${main}<div class="alt2">≈ ${money(convert(n, c, h), h)}</div>` : `${main} ${alt}`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function badge(status){

function progressBar(done, total){

  return `<span class="prog"><span class="track"><span class="fill${pct===100?' done':''}" style="width:${pct}%"></span></span><span class="pct">${pct}%</span></span>`;
}
function download(name, text, type){
  const b = new Blob([text], {type: type || 'application/json'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function csvCell(v){

const KEY = 'sa_tracker_v1';
const blank = () => ({
  version: 1,
  settings: {baseCurrency:'USD', homeCurrency:'BDT', dualCurrency:true, rates: {...DEFAULT_RATES}, theme:'light', owner:'', intake:''},
  programs: [], documents: [], recommenders: [], tests: [],
  scholarships: [], expenses: [], visas: [], contacts: []
});
let state = blank();
let fileHandle = null;
let dirty = false;

function setSaveStatus(kind, text){
  const d = $('#save-dot'); d.className = 'dot' + (kind ? ' ' + kind : '');
  $('#save-text').textContent = text;
}

async function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    dirty = false;
    setSaveStatus('', fileHandle ? 'Saved → file' : 'Saved locally');
  }catch(e){
    setSaveStatus('err', 'Browser storage failed — export!');
  }
  if(fileHandle){
    try{
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(state, null, 2));
      await w.close();
    }catch(e){ setSaveStatus('stale', 'File write failed'); }
  }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(blank(), parsed);
      state.settings = Object.assign(blank().settings, parsed.settings || {});
      state.settings.rates = Object.assign({...DEFAULT_RATES}, state.settings.rates || {});
    }
  }catch(e){ console.warn('Could not read saved data', e); }
}

/* file-handle persistence so "link a data file" survives reloads */
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('sa_tracker_fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbSet(v){ try{ const db = await idb(); const tx = db.transaction('h','readwrite'); tx.objectStore('h').put(v,'file'); }catch(e){} }
async function idbGet(){ try{ const db = await idb(); return await new Promise(r => { const q = db.transaction('h').objectStore('h').get('file'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); }catch(e){ return null; } }

async function linkFile(){
  if(!window.showSaveFilePicker){ toast('Your browser does not support direct file saving — use Export instead'); return; }
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'study-abroad-data.json',
      types: [{description:'JSON', accept:{'application/json':['.json']}}]
    });
    await idbSet(fileHandle); await save(); toast('Linked — every change now writes to that file');
    render();
  }catch(e){}
}
async function openFileLink(){
  if(!window.showOpenFilePicker){ return importPrompt(); }
  try{
    const [h] = await window.showOpenFilePicker({types:[{description:'JSON', accept:{'application/json':['.json']}}]});
    const f = await h.getFile(); const data = JSON.parse(await f.text());
    if(!data || !Array.isArray(data.programs)) throw new Error('not a tracker file');
    state = Object.assign(blank(), data);
    state.settings = Object.assign(blank().settings, data.settings || {});
    fileHandle = h; await idbSet(h); await save();
    toast('Loaded and linked'); applyTheme(); render();
  }catch(e){ if(e && e.name !== 'AbortError') toast('Could not open that file'); }
}
async function restoreHandle(){
  const h = await idbGet(); if(!h) return;
  try{
    const perm = await h.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ fileHandle = h; setSaveStatus('', 'Saved → file'); }
    else setSaveStatus('stale', 'File link needs re-approval');
  }catch(e){}
}

function exportJSON(){
  download('study-abroad-backup-' + todayISO() + '.json', JSON.stringify(state, null, 2));
  toast('Backup downloaded');
}
function importPrompt(){
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!data || !Array.isArray(data.programs)) throw new Error('bad file');
        if(!confirm('Replace everything currently in the tracker with this file?')) return;
        state = Object.assign(blank(), data);
        state.settings = Object.assign(blank().settings, data.settings || {});
        save(); applyTheme(); render(); toast('Data imported');
      }catch(e){ alert('That does not look like a tracker backup file.'); }
    };
    r.readAsText(f);
  };
  i.click();
}

/**
 * Schema-driven record editor.
 * fields: [{key,label,type,options,placeholder,hint,full,min,step}]
 */
function openForm(opts){
  const {title, fields, record = {}, onSave, onDelete, wide} = opts;
  const body = fields.map(f => {
    const v = record[f.key] ?? f.default ?? '';
    let ctrl = '';
    if(f.type === 'textarea') ctrl = `<textarea data-k="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
    else if(f.type === 'select') ctrl = `<select data-k="${f.key}">${(f.allowEmpty!==false?`<option value="">—</option>`:'')}${f.options.map(o => {
        const val = typeof o === 'string' ? o : o.value, lab = typeof o === 'string' ? o : o.label;
        return `<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(lab)}</option>`;
      }).join('')}</select>`;
    else if(f.type === 'checks') ctrl = `<div class="pill-row" data-multi="${f.key}">${f.options.map(o => {
        const on = Array.isArray(v) && v.includes(o.value);
        return `<label class="badge" style="cursor:pointer"><input type="checkbox" value="${esc(o.value)}" ${on?'checked':''} style="margin:0">${esc(o.label)}</label>`;
      }).join('') || '<span class="muted small">Nothing to link yet.</span>'}</div>`;
    else ctrl = `<input type="${f.type||'text'}" data-k="${f.key}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}"${f.step?` step="${f.step}"`:''}${f.min!==undefined?` min="${f.min}"`:''}>`;
    return `<div class="${f.full?'full':''}"><label class="fl">${esc(f.label)}</label>${ctrl}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
  }).join('');

  $('#overlays').innerHTML = `
    <div class="scrim" data-close>
      <div class="modal${wide?' wide':''}">
        <div class="modal-h"><h3>${esc(title)}</h3></div>
        <div class="modal-b"><div class="fgrid">${body}</div></div>
        <div class="modal-f">
          ${onDelete ? '<button class="btn danger" data-del style="margin-right:auto">Delete</button>' : ''}
          <button class="btn" data-close>Cancel</button>
          <button class="btn primary" data-ok>Save</button>
        </div>
      </div>
    </div>`;
  const root = $('#overlays');
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', e => { if(e.target === el) closeOverlay(); }));
  root.querySelector('[data-ok]').addEventListener('click', () => {
    const out = {...record};
    fields.forEach(f => {
      if(f.type === 'checks'){
        out[f.key] = [...root.querySelectorAll(`[data-multi="${f.key}"] input:checked`)].map(i => i.value);
      }else{
        const el = root.querySelector(`[data-k="${f.key}"]`);
        let val = el ? el.value : '';
        if(f.type === 'number') val = val === '' ? '' : Number(val);
        out[f.key] = val;
      }
    });
    closeOverlay(); onSave(out);
  });
  if(onDelete) root.querySelector('[data-del]').addEventListener('click', () => {
    if(confirm('Delete this permanently?')){ closeOverlay(); onDelete(); }
  });
  document.addEventListener('keydown', escClose);
  const first = root.querySelector('input,select,textarea'); if(first) first.focus();
}

const prog = id => state.programs.find(p => p.id === id);
const progName = id => { const p = prog(id); return p ? p.university : ''; };
function progLabel(p){ return p.university + (p.program ? ' — ' + p.program : ''); }
function reqStats(p){
  const r = p.reqs || [];
  return {done: r.filter(x => x.done).length, total: r.length};
}
function programOptions(){ return state.programs.map(p => ({value:p.id, label:progLabel(p)})); }

function collectDeadlines(){
  const out = [];
  const push = (date, title, sub, view, id) => { if(date) out.push({date, title, sub, view, id, d: daysUntil(date)}); };
  state.programs.forEach(p => {
    if(['Rejected','Withdrawn','Enrolled'].includes(p.status)) return;
    if(!['Submitted','Interview','Offer'].includes(p.status)) push(p.appDeadline, 'Application deadline', progLabel(p), 'applications', p.id);
    push(p.scholarshipDeadline, 'Scholarship deadline', progLabel(p), 'applications', p.id);
    (p.reqs || []).forEach(r => { if(!r.done) push(r.due, r.label, progLabel(p), 'applications', p.id); });
  });
  state.scholarships.forEach(s => { if(s.status === 'Researching' || s.status === 'Applied') push(s.deadline, s.name, s.programId ? progName(s.programId) : 'Scholarship', 'scholarships', s.id); });
  state.recommenders.forEach(r => (r.requests || []).forEach(q => {
    if(q.status !== 'Submitted' && q.status !== 'Declined') push(q.deadline, 'LOR from ' + r.name, progName(q.programId), 'recommenders', r.id);
  }));
  state.tests.forEach(t => push(t.expiry, t.name + ' score expires', 'Valid until', 'tests', t.id));
  state.visas.forEach(v => push(v.appointment, 'Visa appointment', v.country || '', 'visa', v.id));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function matchProgram(p){
  if(filters.status && p.status !== filters.status) return false;
  if(filters.country && p.country !== filters.country) return false;
  if(!q) return true;
  const hay = [p.university, p.program, p.country, p.city, p.intake, p.degree, p.notes].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function wireDrawer(p){
  const root = $('#overlays');
  const ed = root.querySelector('[data-edit]');
  if(ed) ed.addEventListener('click', () => editProgram(p));
  const tpl = root.querySelector('[data-tpl]');
  if(tpl) tpl.addEventListener('click', () => {
    p.reqs = p.reqs || [];
    const have = new Set(p.reqs.map(r => r.label));
    REQ_TEMPLATE.forEach(l => { if(!have.has(l)) p.reqs.push({label:l, done:false, due:p.appDeadline || ''}); });
    save(); paintDrawer(p); render();
  });
  root.querySelectorAll('[data-req]').forEach(cb => cb.addEventListener('change', () => {
    p.reqs[Number(cb.dataset.req)].done = cb.checked; save(); paintDrawer(p); render();
  }));
  root.querySelectorAll('[data-req-del]').forEach(b => b.addEventListener('click', () => {
    p.reqs.splice(Number(b.dataset.reqDel), 1); save(); paintDrawer(p); render();
  }));
  const add = root.querySelector('[data-req-add]');
  if(add){
    const doAdd = () => {
      const t = root.querySelector('#req-new'), d = root.querySelector('#req-due');
      if(!t.value.trim()) return;
      p.reqs = p.reqs || []; p.reqs.push({label:t.value.trim(), done:false, due:d.value || ''});
      save(); paintDrawer(p); render();
      setTimeout(() => { const n = $('#overlays').querySelector('#req-new'); if(n) n.focus(); }, 0);
    };
    add.addEventListener('click', doAdd);
    root.querySelector('#req-new').addEventListener('keydown', e => { if(e.key === 'Enter') doAdd(); });
  }
  const nt = root.querySelector('#d-notes');
  if(nt) nt.addEventListener('input', () => { p.notes = nt.value; clearTimeout(wireDrawer._t); wireDrawer._t = setTimeout(save, 400); });
}

/* ---------------- recommender request manager (per program) -------------- */
function openRecommender(id){
  const r = state.recommenders.find(x => x.id === id); if(!r) return;
  r.requests = r.requests || [];
  const paint = () => {
    $('#overlays').innerHTML = `
    <div class="scrim" data-close><div class="modal">
      <div class="modal-h"><h3>${esc(r.name)}</h3><span class="sub muted small">${esc(r.title || '')}${r.org ? ' · ' + esc(r.org) : ''}</span>
        <button class="btn sm" style="margin-left:auto" data-editrec>Edit details</button></div>
      <div class="modal-b" style="padding:0">
        <div style="padding:14px 20px 6px" class="small muted">Letter requests — one row per application.</div>
        ${r.requests.length ? r.requests.map((q, i) => `
          <div class="chk">
            <div class="l"><div class="t">${esc(progName(q.programId) || 'Unlinked')}</div>
              <div class="n">${q.deadline ? 'Due ' + fmtDate(q.deadline) : 'No deadline set'}${q.requested ? ' · asked ' + fmtDate(q.requested) : ''}</div></div>
            <select data-rq="${i}" style="width:auto">${REQ_STATUS.map(s => `<option${q.status === s ? ' selected' : ''}>${s}</option>`).join('')}</select>
            <button class="btn sm ghost" data-rqdel="${i}">✕</button>
          </div>`).join('') : '<div class="empty" style="padding:22px"><p>No letter requests yet.</p></div>'}
        <div class="row-add">
          <select id="rq-p" style="flex:1">${state.programs.map(p => `<option value="${p.id}">${esc(progLabel(p))}</option>`).join('') || '<option value="">Add an application first</option>'}</select>
          <input type="date" id="rq-d" title="Deadline">
          <button class="btn primary sm" data-rqadd>Add</button>
        </div>
      </div>
      <div class="modal-f"><button class="btn" data-close>Close</button></div>
    </div></div>`;
    const root = $('#overlays');
    root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', e => { if(e.target === el) closeOverlay(); }));
    root.querySelector('[data-editrec]').addEventListener('click', () => recCrud.edit(r.id));
    root.querySelectorAll('[data-rq]').forEach(s => s.addEventListener('change', () => {
      const q = r.requests[Number(s.dataset.rq)];
      q.status = s.value;
      if(s.value === 'Asked' && !q.requested) q.requested = todayISO();
      if(s.value === 'Submitted') q.submitted = todayISO();
      save(); paint(); render();
    }));
    root.querySelectorAll('[data-rqdel]').forEach(b => b.addEventListener('click', () => { r.requests.splice(Number(b.dataset.rqdel), 1); save(); paint(); render(); }));
    root.querySelector('[data-rqadd]').addEventListener('click', () => {
      const pid = root.querySelector('#rq-p').value; if(!pid) return;
      const p = prog(pid);
      r.requests.push({programId:pid, status:'Not asked', deadline: root.querySelector('#rq-d').value || (p ? p.appDeadline : '') || ''});
      save(); paint(); render();
    });
  };
  paint(); document.addEventListener('keydown', escClose);
}

/* -------------------------- visa step checklist -------------------------- */
function openVisa(id){
  const v = state.visas.find(x => x.id === id); if(!v) return;
  if(!v.steps) v.steps = VISA_STEPS.map(l => ({label:l, done:false}));
  const paint = () => {
    const done = v.steps.filter(s => s.done).length;
    $('#overlays').innerHTML = `
    <div class="scrim" data-close><div class="modal">
      <div class="modal-h"><h3>${esc(v.country)} — ${esc(v.type || 'student visa')}</h3>
        <span class="small muted">${done}/${v.steps.length} steps</span>
        <button class="btn sm" style="margin-left:auto" data-editvisa>Edit details</button></div>
      <div class="modal-b" style="padding:0">
        ${v.steps.map((s, i) => `<div class="chk${s.done ? ' done' : ''}">
          <input type="checkbox" data-vs="${i}" ${s.done ? 'checked' : ''}>
          <div class="l"><div class="t">${esc(s.label)}</div></div></div>`).join('')}
        <div class="row-add"><input type="text" id="vs-new" placeholder="Add a step…"><button class="btn primary sm" data-vsadd>Add</button></div>
      </div>
      <div class="modal-f"><button class="btn" data-close>Close</button></div>
    </div></div>`;
    const root = $('#overlays');
    root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', e => { if(e.target === el) closeOverlay(); }));
    root.querySelector('[data-editvisa]').addEventListener('click', () => visaCrud.edit(v.id));
    root.querySelectorAll('[data-vs]').forEach(cb => cb.addEventListener('change', () => { v.steps[Number(cb.dataset.vs)].done = cb.checked; save(); paint(); render(); }));
    root.querySelector('[data-vsadd]').addEventListener('click', () => {
      const i = root.querySelector('#vs-new'); if(!i.value.trim()) return;
      v.steps.push({label:i.value.trim(), done:false}); save(); paint();
    });
  };
  paint(); document.addEventListener('keydown', escClose);
}
/* ============================ SIMPLE LIST VIEWS =========================== */
function toolbar(ph, extra){
  return `<div class="toolbar"><div class="search"><input type="text" id="q" placeholder="${esc(ph)}" value="${esc(q)}"></div>${extra || ''}</div>`;
}
function wireSearch(){
  const i = $('#q'); if(!i) return;
  i.addEventListener('input', e => {
    q = e.target.value; const s = $('#view').scrollTop; render(); $('#view').scrollTop = s;
    const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  });
}
const hit = (...parts) => !q || parts.join(' ').toLowerCase().includes(q.toLowerCase());

AFTER.data = () => {

};

function exportCSV(){
  const cols = ['university','program','country','city','degree','intake','tier','status','appDeadline','scholarshipDeadline','decisionDate','duration','currency','tuition','livingCost','award','appFee','ranking','workRights','portalUrl','portalUser','notes'];
  const head = ['University','Programme','Country','City','Degree','Intake','Tier','Status','App deadline','Scholarship deadline','Decision expected','Duration','Currency','Tuition','Living cost','Scholarship awarded','App fee','Ranking','Post-study work','Portal URL','Portal user','Notes','Checklist done','Checklist total'];
  const lines = [head.map(csvCell).join(',')];
  state.programs.forEach(p => {
    const s = reqStats(p);
    lines.push(cols.map(c => csvCell(p[c])).concat([s.done, s.total]).join(','));
  });
  download('applications-' + todayISO() + '.csv', lines.join('\n'), 'text/csv');
  toast('CSV downloaded');
}

const ACTIONS = {

  'open-program': id => openProgram(id),
  'add-document': () => docCrud.add(),
  'edit-document': id => docCrud.edit(id),
  'add-recommender': () => recCrud.add(),
  'open-recommender': id => openRecommender(id),
  'add-test': () => testCrud.add(),
  'edit-test': id => testCrud.edit(id),
  'add-scholarship': () => schCrud.add(),
  'edit-scholarship': id => schCrud.edit(id),
  'add-expense': () => expCrud.add(),
  'edit-expense': id => expCrud.edit(id),
  'add-visa': () => visaCrud.add(),
  'open-visa': id => openVisa(id),
  'add-contact': () => conCrud.add(),
  'edit-contact': id => conCrud.edit(id),
  'export': () => exportJSON(),
  'import': () => importPrompt(),
  'export-csv': () => exportCSV(),
  'link-file': () => linkFile(),
  'open-file': () => openFileLink(),
  'seed': () => seed(),
  'share-copy': () => {
    const clone = document.documentElement.cloneNode(true);
    ['#view','#overlays','#nav'].forEach(s => { const el = clone.querySelector(s); if(el) el.innerHTML = ''; });
    const t = clone.querySelector('#toast'); if(t){ t.textContent = ''; t.className = ''; }
    clone.setAttribute('data-theme', 'light');
    download('study-abroad-tracker.html', '<!doctype html>\n' + clone.outerHTML, 'text/html');
    toast('Clean copy downloaded — it contains none of your data');
  },
  'wipe': () => {
    if(!confirm('This erases every application, document and record in the tracker. Export a backup first if you are not sure.')) return;
    if(!confirm('Last check — really erase everything?')) return;
    const theme = state.settings.theme;
    state = blank(); state.settings.theme = theme;
    save(); render(); toast('Everything erased');
  },
};

/* ============================= EVENT WIRING ============================== */
$('#view').addEventListener('click', e => {
  const g = e.target.closest('[data-go2]');
  if(g && !e.target.closest('[data-act]')){ go(g.dataset.go2); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(e.target.tagName === 'A') return;
  const fn = ACTIONS[el.dataset.act];
  if(fn) fn(el.dataset.id, el, e);
});
$('#theme-btn').addEventListener('click', toggleTheme);
$('#menu-btn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
window.addEventListener('beforeunload', () => { if(dirty) save(); });
document.addEventListener('keydown', e => {
  if(e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)){
    const s = $('#q'); if(s){ e.preventDefault(); s.focus(); }
  }
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); exportJSON(); }
});

/* ================================= BOOT ================================== */
load();
applyTheme();
render();
setSaveStatus('', state.programs.length ? 'Saved locally' : 'Ready');
restoreHandle();
